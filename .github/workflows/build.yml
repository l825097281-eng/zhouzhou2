name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zlib1g-dev ncurses-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev autoconf automake libtool pkg-config openjdk-17-jdk unzip zip wget

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | tee build_output.log
          echo "=== Build finished, checking bin directory ==="
          ls -la bin/ || echo "bin directory not found"
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload full log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build_output.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zhouzhou-apk
          path: bin/*.apk
